name: Open Citadel

on:
  push:
    branches:
      - feat/open-citadel
  pull_request:
    paths:
      - "OPEN_CITADEL.md"
      - "Makefile"
      - "tools/open_citadel_import.py"
      - "tests/test_open_citadel_import.py"
      - "open_citadel/**"
      - "android/**"
      - "loader/**"
      - "jni/**"
      - "src/**"
      - "thunks/**"
      - ".github/workflows/open-citadel.yml"
  workflow_dispatch:

jobs:
  donor-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python unit tests
        run: python3 -m unittest -v tests/test_open_citadel_import.py
      - name: Syntax check
        run: python3 -m py_compile tools/open_citadel_import.py tests/test_open_citadel_import.py

  atc-decoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ATC decoder regression test
        run: g++ -std=c++20 -O2 -Wall -Wextra -Isrc tools/atc_color_test.cpp src/atc_decompress.cpp -o /tmp/atc_color_test
      - name: Run ATC decoder regression test
        run: /tmp/atc_color_test
      - name: Build ATC alpha regression test
        run: g++ -std=c++20 -O2 -Wall -Wextra -Isrc tools/atc_alpha_test.cpp src/atc_decompress.cpp -o /tmp/atc_alpha_test
      - name: Run ATC alpha regression test
        run: /tmp/atc_alpha_test

  x86-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Enable i386
        run: sudo dpkg --add-architecture i386
      - name: Install 32-bit build/runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-multilib libc6-dev-i386 libsdl2-dev:i386 zlib1g-dev:i386 libbsd-dev:i386
      - name: Verify 32-bit SDL
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
        run: |
          printf '#include <SDL2/SDL.h>\nint main(){return 0;}\n' > /tmp/probe.cpp
          g++ -m32 /tmp/probe.cpp $(pkg-config --cflags --libs sdl2) -o /tmp/probe32
          file /tmp/probe32
      - name: Build Open Citadel i386 host
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
        run: |
          make open-citadel-x86 OC_PKG_CONFIG=pkg-config
          file build/open-citadel-x86
          ldd build/open-citadel-x86
      - name: Stage portable i386 runtime
        run: |
          set -eux
          out=build/open-citadel-x86-bundle
          mkdir -p "$out/lib" "$out/dri"
          cp build/open-citadel-x86 "$out/"
          cp -L /lib/ld-linux.so.2 "$out/ld-linux.so.2"

          # SDL loads EGL/GLES and Mesa's DRI driver dynamically, so ldd on
          # the executable alone is not enough. Seed those objects explicitly,
          # then recursively collect every absolute dependency they report.
          seeds="build/open-citadel-x86 /usr/lib/i386-linux-gnu/libEGL.so.1 /usr/lib/i386-linux-gnu/libGLESv2.so.2"
          if [ -f /usr/lib/i386-linux-gnu/dri/swrast_dri.so ]; then
            cp -L /usr/lib/i386-linux-gnu/dri/swrast_dri.so "$out/dri/"
            seeds="$seeds /usr/lib/i386-linux-gnu/dri/swrast_dri.so"
          fi

          pending="$seeds"
          seen=""
          while [ -n "$pending" ]; do
            next=""
            for obj in $pending; do
              case " $seen " in *" $obj "*) continue ;; esac
              seen="$seen $obj"
              [ -e "$obj" ] || continue
              case "$obj" in
                /usr/lib/i386-linux-gnu/dri/*)
                  ;;
                /usr/lib/i386-linux-gnu/*|/lib/i386-linux-gnu/*|/lib32/*)
                  cp -Lf "$obj" "$out/lib/$(basename "$obj")"
                  ;;
              esac
              for dep in $(ldd "$obj" 2>/dev/null | awk '/=> \/|^\// {for(i=1;i<=NF;i++) if($i ~ /^\//) print $i}'); do
                case " $seen " in *" $dep "*) ;; *) next="$next $dep" ;; esac
              done
            done
            pending="$next"
          done

          cp -L /usr/lib/i386-linux-gnu/libEGL.so.1 "$out/lib/"
          cp -L /usr/lib/i386-linux-gnu/libGLESv2.so.2 "$out/lib/"
          file "$out/open-citadel-x86" "$out/ld-linux.so.2"
          du -sh "$out"
      - name: Upload portable i386 host
        uses: actions/upload-artifact@v4
        with:
          name: open-citadel-x86-${{ github.sha }}
          path: build/open-citadel-x86-bundle
          retention-days: 7
